# The nightly end-to-end smoke (Unity.Multiplayer's reusable game-smoke workflow): one Linux player of this game
# runs as a dedicated server, the rendezvous service and two bots (GameBot) under Docker Compose until both pass.
# Needs the UNITY_LICENSE secret (GameCI), and MINDATTIC_REPOS_TOKEN if a MindAttic repo is private.
# mp-host.json gives the bots and scenario; see https://mindattic.github.io/Unity.Multiplayer/articles/bots.html
name: Nightly smoke
on:
  schedule: [{ cron: '0 10 * * *' }]
  workflow_dispatch: {}
jobs:
  # A job's `if` can't read secrets, so this tiny job reports whether the Unity license secrets are set (same check as
  # ci.yml's unity-gate, U.RICO-T40). Without them the smoke is skipped with a notice instead of failing (U.RICO-T74).
  # Secrets by name, never printed: UNITY_LICENSE (the .ulf file contents), or UNITY_SERIAL plus UNITY_EMAIL and UNITY_PASSWORD.
  unity-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      enabled: ${{ steps.check.outputs.enabled }}
    steps:
      - id: check
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_SERIAL: ${{ secrets.UNITY_SERIAL }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        run: |
          if [ -n "$UNITY_LICENSE" ] || { [ -n "$UNITY_SERIAL" ] && [ -n "$UNITY_EMAIL" ] && [ -n "$UNITY_PASSWORD" ]; }; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Nightly smoke skipped: no UNITY_LICENSE (or UNITY_SERIAL + UNITY_EMAIL + UNITY_PASSWORD) secret is set."
          fi

  smoke:
    needs: unity-gate
    if: needs.unity-gate.outputs.enabled == 'true'
    uses: mindattic/Unity.Multiplayer/.github/workflows/game-smoke.yml@main
    with:
      siblings: mindattic/MindAttic.Components mindattic/Unity.Shared
    secrets: inherit
